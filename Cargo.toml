[workspace]
resolver = "3"
members = [
    "crates/opencontinuity-core",
    "apps/opencontinuity-cli",
    "services/opencontinuityd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nghianguyen150612/OpenContinuity"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
