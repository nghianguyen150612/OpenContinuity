[workspace]
resolver = "3"
members = [
    "crates/opencontinuity-core",
    "apps/opencontinuity-cli",
    "services/opencontinuityd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nghianguyen150612/OpenContinuity"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
ed25519-dalek = "2.1"
p256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.2"
sha2 = "0.10"
zbus = "=5.12.0"
signal-hook = "0.3"
