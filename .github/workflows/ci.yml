name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sanitized preflight tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Build
        run: cargo build --workspace

  swift-watchos:
    name: Swift tests and watchOS compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apple toolchain inventory
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks
      - name: Swift codec and lifecycle tests
        run: swift test --package-path experiments/watchos
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate watchOS project
        run: xcodegen generate --spec experiments/watchos/project.yml
      - name: Compile watchOS application without signing
        run: >-
          xcodebuild -project experiments/watchos/OpenContinuityWatch.xcodeproj
          -scheme OpenContinuityWatch -configuration Debug
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO build
