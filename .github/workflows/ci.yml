name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sanitized P007B host preflight tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets
      - name: Build
        run: cargo build --workspace

  swift-watchos:
    name: Swift tests and watchOS compile
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - name: Apple toolchain inventory
        run: |
          swift --version
          xcodebuild -version
          xcodebuild -showsdks
      - name: Swift codec and lifecycle tests
        env:
          OC_P008_INTEROP_OUTPUT: ${{ runner.temp }}/watch-auth-response-rust-interop.json
        run: swift test --package-path experiments/watchos
      - name: Build Rust transport fixture tool
        run: cargo build --bin opencontinuity
      - name: Serialize Rust-signed request transport frames
        run: >-
          cargo run --bin opencontinuity -- research watch-auth-transport prepare
          --fixture experiments/watchos/Tests/OpenContinuityWatchTests/Fixtures/watch-auth-request-v1.json
          --output "$RUNNER_TEMP/watch-auth-request-transport.json"
      - name: Run Swift reassembly, CryptoKit verification, signing, and framing
        env:
          OC_P009_TRANSPORT_INPUT: ${{ runner.temp }}/watch-auth-request-transport.json
          OC_P009_TRANSPORT_OUTPUT: ${{ runner.temp }}/watch-auth-response-transport.json
        run: swift test --package-path experiments/watchos --filter WatchAuthTransportTests/testRustRequestSwiftReassemblyAndSignedResponseRustReassembly
      - name: Reassemble and verify Swift-signed response in Rust
        run: >-
          cargo run --bin opencontinuity -- research watch-auth-transport
          verify-response
          --fixture experiments/watchos/Tests/OpenContinuityWatchTests/Fixtures/watch-auth-request-v1.json
          --input "$RUNNER_TEMP/watch-auth-response-transport.json" --json
      - name: Build Rust fixture verifier
        run: cargo build --bin opencontinuity
      - name: Verify CryptoKit response signature in Rust
        run: >-
          cargo run --bin opencontinuity -- research watch-auth
          --fixture "$OC_P008_INTEROP_OUTPUT" --json
        env:
          OC_P008_INTEROP_OUTPUT: ${{ runner.temp }}/watch-auth-response-rust-interop.json
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate watchOS project
        run: xcodegen generate --spec experiments/watchos/project.yml
      - name: Compile watchOS application without signing
        run: >-
          xcodebuild -project experiments/watchos/OpenContinuityWatch.xcodeproj
          -scheme OpenContinuityWatch -configuration Debug
          -destination 'generic/platform=watchOS'
          -derivedDataPath "$RUNNER_TEMP/p010-watch-build"
          CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned development app (local signing required)
        run: >-
          ditto -c -k --keepParent
          "$RUNNER_TEMP/p010-watch-build/Build/Products/Debug-watchos/OpenContinuity Watch.app"
          "$RUNNER_TEMP/OpenContinuityWatch-UNSIGNED-development.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenContinuityWatch-UNSIGNED-development-local-signing-required
          path: ${{ runner.temp }}/OpenContinuityWatch-UNSIGNED-development.zip
          retention-days: 7

  qt-settings:
    name: Qt Settings (Linux)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt 6 development and QML runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-qpa-plugins qt6-wayland \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates
      - name: Build read-only CLI
        run: cargo build --bin opencontinuity
      - name: Configure Settings
        run: cmake -S apps/opencontinuity-settings -B build/settings -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build Settings and native test peer
        run: cmake --build build/settings --parallel 2
      - name: C++ unit tests and real QML window navigation
        env:
          OC_REAL_CLI: ${{ github.workspace }}/target/debug/opencontinuity
        run: ctest --test-dir build/settings --output-on-failure --verbose
      - name: Install to local prefix
        run: |
          cmake --install build/settings --prefix "$RUNNER_TEMP/p011-install"
          install -m 755 target/debug/opencontinuity "$RUNNER_TEMP/p011-install/bin/opencontinuity"
          test -f "$RUNNER_TEMP/p011-install/share/applications/opencontinuity-settings.desktop"
          test -f "$RUNNER_TEMP/p011-install/share/icons/hicolor/scalable/apps/opencontinuity-settings.svg"
          "$RUNNER_TEMP/p011-install/bin/opencontinuity-settings" --version
          python3 apps/opencontinuity-settings/tests/launch_smoke.py "$RUNNER_TEMP/p011-install/bin/opencontinuity-settings"
